[project]
name = "demo-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khun", email = "lykhun@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
    "psycopg2>=2.9.13",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
start = "demo_fast_api:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
